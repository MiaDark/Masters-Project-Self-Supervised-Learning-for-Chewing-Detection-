# Data download + layout configuration.
# Values here can be overridden by environment variables (see src/.../data/download.py).

s3:
  bucket: my-emteq-bucket      # overridden by S3_BUCKET if set
  prefix: chewing/raw/         # overridden by S3_PREFIX if set
  # Optional allow-list of file extensions to pull; empty = everything under prefix.
  include_extensions: [".csv", ".parquet", ".json", ".npy"]

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed

download:
  # Skip files that already exist locally with a matching size (idempotent re-runs).
  skip_existing: true
  # Set true to list what *would* be downloaded without writing anything.
  dry_run: false
