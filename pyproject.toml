[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chewing-ssl"
version = "0.1.0"
description = "Self-supervised multimodal representation learning for chewing detection from smart-glasses sensor data"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "numpy",
    "pyyaml",
    "python-dotenv",
    "boto3",
    "tqdm",
    "mlflow",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "mypy",
]
