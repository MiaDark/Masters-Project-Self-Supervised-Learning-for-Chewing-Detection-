s3:
  bucket: emteq-data
  base_prefix: processed_datasets/ocosense/
  include_extensions: [".csv"]

paths:
  raw: data/raw

download:
  skip_existing: true
  dry_run: false

datasets:

  SIPMEatingStudy:
    enabled: true
    participants: "1-41"

  Spectacle:
    enabled: true
    weeks: [week2]
    participants: "0-32"

  SussexEatingUK:
    enabled: true

  FEIT_eating_S05:
    enabled: true
    type: eating_subfolder
    base_prefix: "raw_aligned_datasets/ocosense/"
    download_subfolders: ["Eating"]

  FEIT_eating:
    enabled: true
    type: eating_subfolder
    base_prefix: "raw_aligned_datasets/ocosense/"
    download_subfolders: ["Eating"]

  Office_eating_s05:
    enabled: true
    type: eating_subfolder
    base_prefix: "raw_aligned_datasets/ocosense/"
    download_subfolders: ["Eating"]

  DiverseNormative:
    enabled: true
    type: direct_csv
    base_prefix: "raw_aligned_datasets/ocosense/"