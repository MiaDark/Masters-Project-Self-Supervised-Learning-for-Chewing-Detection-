name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project and dev dependencies
        run: |
          python -V
          pip --version
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint / format
        run: |
          ruff format .
          ruff check .

      - name: Run tests
        run: |
          python -m pytest tests -q --maxfail=1 || test $? -eq 5