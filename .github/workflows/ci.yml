# name=ci.yml
# Add/merge the following job into your workflow
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip and wheel
        run: |
          python -V
          pip --version
          pip install --upgrade pip setuptools wheel

      - name: Install project and dev dependencies
        run: |
          pip install -e '.[dev]' || \
          # Fallback: if no extras defined, install common dev/test deps explicitly:
          pip install -r requirements.txt pytest ruff numpy pyyaml boto3

      - name: Lint / format (auto-format to avoid CI failing on formatting)
        run: |
          pip install ruff
          # Option: auto-fix formatting so CI doesn't fail before tests run.
          ruff format .
          # Then run ruff check to enforce style
          ruff check .

      - name: Run tests
        run: |
          pip install pytest coverage
          pytest -q --maxfail=1