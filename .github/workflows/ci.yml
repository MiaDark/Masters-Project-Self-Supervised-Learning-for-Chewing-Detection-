- name: Install project and dev dependencies
  run: |
    python -V
    pip --version
    pip install --upgrade pip setuptools wheel
    # Installs core dependencies + ruff, pytest, etc. in one go
    pip install -e ".[dev]" 

- name: Lint / format
  run: |
    ruff format .
    ruff check .

- name: Run tests
  run: |
    python -m pytest tests -q --maxfail=1 --suppress-no-test-exit-code